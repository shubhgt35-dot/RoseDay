<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sonakshi ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(180deg,#ff5f6d,#ffb6c1);
  font-family:'Segoe UI',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

#start{
  font-size:26px;
  padding:16px 34px;
  border:2px solid white;
  border-radius:40px;
  cursor:pointer;
  animation:pulse 1.5s infinite;
  background:rgba(255,255,255,0.15);
}

#content{
  display:none;
  text-align:center;
  max-width:92%;
  animation:fadeIn 2.2s forwards;
}

h1{
  font-size:38px;
}

p{
  font-size:18px;
  line-height:1.7;
}

.gallery{
  display:flex;
  gap:10px;
  margin:18px 0;
  justify-content:center;
}

.gallery img{
  width:90px;
  height:120px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 0 12px rgba(255,255,255,0.5);
  animation:zoom 3s infinite;
}

#love{
  font-size:42px;
  margin-top:18px;
  color:#fff;
  display:none;
  animation:heartbeat 1.4s infinite;
}

.signature{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
